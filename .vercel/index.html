<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tof</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      color: #e8e8e8;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .avatar {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden; /* Important */
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

    .name {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: #f0f0f0;
    }

    .bio {
      font-size: 0.85rem;
      color: #666;
      font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      text-decoration: none;
      color: #e8e8e8;
      font-size: 0.9rem;
      font-weight: 400;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      cursor: pointer;
    }

    .link-btn:hover {
      background: #161616;
      border-color: #2e2e2e;
      transform: translateY(-1px);
    }

    .link-btn:active {
      transform: translateY(0);
    }

    .link-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-youtube { background: #1a0a0a; }
    .icon-spotify { background: #0a1a0e; }
    .icon-traktrain { background: #0a0a0a; }

    .link-icon svg,
    .link-icon img {
      width: 18px;
      height: 18px;
    }

    .icon-traktrain img {
      width: 22px;
      height: 22px;
    }

    .link-label {
      flex: 1;
      font-weight: 400;
      color: #ccc;
    }

    .link-arrow {
      color: #333;
      font-size: 0.75rem;
    }

    .footer {
      font-size: 0.7rem;
      color: #333;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="avatar">
      <img src="images/icon 2.jpg" alt="Profile Picture">
  </div>

    <div class="profile">
      <h1 class="name">tof</h1>
      <p class="bio"></p>
    </div>

    <div class="links">
      <a class="link-btn" href="https://open.spotify.com/artist/1B2hQAA9QwGFfdl4IZXqik?si=UCUE2cr3Rzeejnlu7nRtKQ" target="_blank" rel="noopener">
        <div class="link-icon icon-spotify">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" fill="#1ed760" opacity="0.85"/>
            <path d="M16.5 10.5c-2.5-1.5-6.5-1.5-8.5-.5" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
            <path d="M15.5 13c-2-1.2-5.5-1.2-7.5-.2" stroke="#0a0a0a" stroke-width="1.3" stroke-linecap="round" fill="none"/>
            <path d="M14.5 15.5c-1.7-1-4.5-1-6-.2" stroke="#0a0a0a" stroke-width="1.1" stroke-linecap="round" fill="none"/>
          </svg>
        </div>
        <span class="link-label">Spotify</span>
        <span class="link-arrow">↗</span>
      </a>

      <a class="link-btn" href="https://youtube.com/@0xthf?si=lIijm2-118yE4kTE" target="_blank" rel="noopener">
        <div class="link-icon icon-youtube">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 0 0-1.95 1.96A29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58A2.78 2.78 0 0 0 3.41 19.54C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z" fill="#ff4040" opacity="0.85"/>
            <polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="#0a0a0a"/>
          </svg>
        </div>
        <span class="link-label">YouTube</span>
        <span class="link-arrow">↗</span>
      </a>

      <a class="link-btn" href="https://traktrain.com/0xthf" target="_blank" rel="noopener">
        <div class="link-icon icon-traktrain">
          <img src="traktrain-icon.png" alt="" />
        </div>
        <span class="link-label">Traktrain</span>
        <span class="link-arrow">↗</span>
      </a>
    </div>

    <p class="footer">QUEROISSOTUDOPRAAGORA</p>
  </div>
</body>
</html>
